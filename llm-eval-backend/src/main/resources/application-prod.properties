# Production Environment Configuration

# MySQL Database for Production
# Change these settings according to your MySQL setup:
# - localhost:3306 -> your MySQL server host:port
# - llm_evaluate -> your database name
# - useSSL=false -> set to true if using SSL
spring.datasource.url=jdbc:mysql://localhost:3306/llm_evaluate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:-thesumst}
spring.datasource.password=${MYSQL_PASSWORD:-Zhu232301771902}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for Production
# DDL Auto options:
# - validate: Validate schema, make no changes
# - update: Update schema if needed
# - create: Create schema on startup (WARNING: drops existing data)
# - create-drop: Create on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging for Production
logging.level.top.thesumst.llm_eval_backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN 