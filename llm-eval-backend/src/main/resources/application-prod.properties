# Production Environment Configuration

# MySQL Database for Production
spring.datasource.url=jdbc:mysql://localhost:3306/llm_evaluate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:llmeval}
spring.datasource.password=${MYSQL_PASSWORD:llmeval123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging for Production
logging.level.top.thesumst.llm_eval_backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN 